name: Claude PR review

# Pull request review by Claude through the Claude Code GitHub Action, paid from the
# organization's Claude Console API credits (ANTHROPIC_API_KEY secret). It runs once when a
# pull request is opened, reopened or marked ready, not on every push.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the Claude review."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude review
        if: steps.key.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.

            Scope: the changes are exactly the output of `gh pr diff ${{ github.event.pull_request.number }}`.
            Read that diff first and review only those changed lines, using the surrounding
            code for context. Do not review files the diff does not touch.

            Report only real problems: bugs, security issues, data loss, broken API or data
            contracts, and changed behaviour without a test. Skip style and wording nits.

            Post each finding as an inline comment on the line it concerns, with the concrete
            failure scenario and a suggested fix. If you find nothing worth flagging, post one
            short summary comment saying so.

            Do not modify files, push commits or approve the pull request.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
