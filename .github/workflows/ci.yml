name: Bilinc CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"

      - name: Run Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check src tests benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install internal runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,internal]'

      - name: Run internal runtime test suite
        run: pytest -q tests

      - name: Run cloud-only package tests
        run: PYTHONPATH=src pytest -q tests/test_cloud_only_package.py

      - name: Run import smoke
        run: |
          python -c "import bilinc; print(f'bilinc {bilinc.version} imported successfully')"
          python -c "from bilinc import CloudClient, Bilinc; print(CloudClient is Bilinc)"
          python -c "import bilinc; raise SystemExit(1 if hasattr(bilinc, 'StatePlane') else 0)"

      - name: Run cloud-only CLI smoke
        run: |
          bilinc --version
          bilinc signup
          ! bilinc commit --key smoke_key --value hello

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package artifacts
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: bilinc-dist
          path: dist/*

  artifact-validation:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: bilinc-dist
          path: dist/

      - name: Validate wheel
        run: |
          pip install dist/*.whl
          python -I -c "import bilinc; assert not hasattr(bilinc, 'StatePlane'); print(bilinc.__version__)"
          bilinc --version && bilinc signup

      - name: Validate sdist
        run: |
          pip install --force-reinstall dist/*.tar.gz
          python -I -c "import bilinc; assert not hasattr(bilinc, 'StatePlane'); print(bilinc.__version__)"
          bilinc --version && bilinc signup

      - name: Assert distribution contents
        run: |
          pip install pytest
          BILINC_TEST_WHEEL="$(echo dist/*.whl)" BILINC_TEST_SDIST="$(echo dist/*.tar.gz)" pytest -q tests/test_cloud_only_package.py -k built
