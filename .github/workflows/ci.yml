name: Bilinc CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check src tests benchmarks

  benchmark-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate benchmark metric and evidence contracts
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q tests/test_benchmark_metrics.py tests/test_benchmark_evidence.py
          python -m benchmarks.validate_evidence --allow-missing-raw

  release-truth:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate canonical public truth
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python scripts/validate_public_truth.py
          python scripts/generate_public_truth_doc.py --check
          pytest -q tests/test_public_truth_contract.py

  secret-safe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Reject likely credentials without disclosing values
        run: |
          python -m pip install --upgrade pip pytest
          python scripts/check_secret_safety.py
          pytest -q tests/test_secret_safety.py

  public-source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install public package test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run cloud-only public contract
        run: |
          PYTHONPATH=src pytest -q -m public_source
          python -c "import bilinc; assert not hasattr(bilinc, 'StatePlane')"

  internal-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install internal runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,internal]'

      - name: Run internal runtime test suite
        run: pytest -q -m internal_runtime

      - name: Run cloud-only package tests
        run: PYTHONPATH=src pytest -q tests/test_cloud_only_package.py

      - name: Run import smoke
        run: |
          python -c "import bilinc; print(f'bilinc {bilinc.version} imported successfully')"
          python -c "from bilinc import CloudClient, Bilinc; print(CloudClient is Bilinc)"
          python -c "import bilinc; raise SystemExit(1 if hasattr(bilinc, 'StatePlane') else 0)"

      - name: Run cloud-only CLI smoke
        run: |
          bilinc --version
          bilinc signup
          ! bilinc commit --key smoke_key --value hello

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package artifacts
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bilinc-dist
          path: dist/*

  artifact-validation:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bilinc-dist
          path: dist/

      - name: Validate wheel
        run: |
          pip install dist/*.whl
          python -I -c "import bilinc; assert not hasattr(bilinc, 'StatePlane'); print(bilinc.__version__)"
          bilinc --version && bilinc signup

      - name: Validate sdist
        run: |
          pip install --force-reinstall dist/*.tar.gz
          python -I -c "import bilinc; assert not hasattr(bilinc, 'StatePlane'); print(bilinc.__version__)"
          bilinc --version && bilinc signup

      - name: Assert distribution contents
        run: |
          pip install pytest
          BILINC_TEST_WHEEL="$(echo dist/*.whl)" BILINC_TEST_SDIST="$(echo dist/*.tar.gz)" pytest -q tests/test_cloud_only_package.py -k built
